apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: 'mcs-cadvisor'
        scheme: https
        metrics_path: /cadvisor/metrics
        static_configs:
          - targets: ['mcs.{{PROMETHEUS.CLOUD_PROVIDER_FQDN}}']
            labels:
              host: mcs

      - job_name: 'mcs-node'
        scheme: https
        metrics_path: /node/metrics
        static_configs:
          - targets: ['mcs.{{PROMETHEUS.CLOUD_PROVIDER_FQDN}}']
            labels:
              host: mcs

      - job_name: 'artifactory-cadvisor'
        scheme: https
        metrics_path: /cadvisor/metrics
        static_configs:
          - targets: ['artifactory.{{PROMETHEUS.CLOUD_PROVIDER_FQDN}}']
            labels:
              host: artifactory

      - job_name: 'artifactory-node'
        scheme: https
        metrics_path: /node/metrics
        static_configs:
          - targets: ['artifactory.{{PROMETHEUS.CLOUD_PROVIDER_FQDN}}']
            labels:
              host: artifactory

      - job_name: 'dc0102-cadvisor'
        scheme: https
        metrics_path: /cadvisor/metrics
        static_configs:
          - targets: ['dc0102.{{PROMETHEUS.CLOUD_PROVIDER_FQDN}}']
            labels:
              host: dc0102

      - job_name: 'dc0102-node'
        scheme: https
        metrics_path: /node/metrics
        static_configs:
          - targets: ['dc0102.{{PROMETHEUS.CLOUD_PROVIDER_FQDN}}']
            labels:
              host: dc0102

      # ginger-infra devices — one shared host, device identity is in the
      # path rather than the target. Each device registered via the
      # heartbeat/presence service (with the "metrics" capability enabled)
      # needs its own static_config entry here, keyed by its channel id
      # (see GET /presence/available-devices).
      - job_name: 'ginger-infra-air'
        scheme: https
        metrics_path: /presence/device-metrics/air.ginger_infra_43c6ba1f-a17f-4eb3-b4d8-7a3e565abc8d
        static_configs:
          - targets: ['api.gingersociety.org']
            labels:
              host: air
              device_channel: air.ginger_infra_43c6ba1f-a17f-4eb3-b4d8-7a3e565abc8d

      - job_name: 'ginger-infra-dc0102'
        scheme: https
        metrics_path: /presence/device-metrics/dc0102.ginger_infra_43c6ba1f-a17f-4eb3-b4d8-7a3e565abc8d
        static_configs:
          - targets: ['api.gingersociety.org']
            labels:
              host: dc0102
              device_channel: dc0102.ginger_infra_43c6ba1f-a17f-4eb3-b4d8-7a3e565abc8d

      # Live chat + analytics metrics of reachout-postman, scraped in-cluster
      # (postman_* custom metrics plus rocket_http_requests_* from rocket_prometheus).
      - job_name: 'reachout-postman'
        scheme: http
        metrics_path: /reachout-postman/metrics
        scrape_interval: 15s   # matches the service's gauge sampler (SAMPLER_INTERVAL_SECS)
        scrape_timeout: 10s
        static_configs:
          - targets: ['reachout-service:80']
            labels:
              service: reachout-postman