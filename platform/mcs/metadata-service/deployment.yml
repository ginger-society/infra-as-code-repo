apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadataservice
  labels:
    app: metadataservice
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: metadataservice
  template:
    metadata:
      annotations:
        x-ginger-code-ejectable: "metadataservice"
      labels:
        app: metadataservice
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:latest
          command:
            - sh
            - -c
            - |
              until pg_isready -h metadata-postgresql -p 5432 -U postgres; do
                echo "Waiting for DB..."
                sleep 5
              done

      containers:
        - name: metadataservice
          image: docker.gingersociety.org/ginger-society/metadata-service:latest
          ports:
            - containerPort: 8000

          env:
            # ✅ DATABASE_URL from secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: metadata-service-api-secrets
                  key: DATABASE_URL

            # ✅ Redis (unchanged)
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: estonia-redis-auth
                  key: url

            # ✅ App secrets from same secret
            - name: ISC_SECRET
              valueFrom:
                secretKeyRef:
                  name: metadata-service-api-secrets
                  key: ISC_SECRET

            - name: ROCKET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: metadata-service-api-secrets
                  key: ROCKET_SECRET_KEY

            # ✅ Global secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET

            # ✅ Static config
            - name: ROCKET_ADDRESS
              value: "0.0.0.0"

            - name: ROCKET_PORT
              value: "8000"

          # Protects slow-starting pods (DB/Redis connection setup) from
          # being killed by the liveness probe before they're actually up.
          # Once this succeeds, readiness/liveness take over.
          startupProbe:
            httpGet:
              path: /metadata/
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          # Gates the rollout: a new pod that fails this never becomes
          # Ready, so combined with maxUnavailable: 0 above, Kubernetes
          # will never kill the old working pod for a broken new one.
          readinessProbe:
            httpGet:
              path: /metadata/
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Steady-state health check: restarts the container if it's up
          # but wedged (hung connection pool, deadlock, etc.).
          livenessProbe:
            httpGet:
              path: /metadata/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3