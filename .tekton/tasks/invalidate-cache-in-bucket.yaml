apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: invalidate-bucket-cache
  namespace: default
spec:
  params:
    - name: bucket-path
      type: string
      description: Bucket directory or package name

  steps:
    - name: invalidate-cache
      image: curlimages/curl:latest
      script: |
        #!/bin/sh
        set -eu

        BUCKET_PATH="$(params.bucket-path)"
        URL="https://bucket.gingersociety.org/invalidate-cache/${BUCKET_PATH}/"

        echo "Invalidating cache: ${URL}"

        curl --fail-with-body --show-error --silent \
          --request POST \
          "${URL}"